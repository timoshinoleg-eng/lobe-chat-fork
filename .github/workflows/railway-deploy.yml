name: Railway Auto Deploy

on:
  push:
    branches: [canary]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Railway Deploy via API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Triggering deployment via Railway GraphQL API..."
          
          RESPONSE=$(curl -s -X POST \
            https://backboard.railway.app/graphql/v2 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -d '{
              "query": "mutation DeploymentTrigger { deploymentTrigger(input: { projectId: \"3976f97a-f083-46f3-afdc-351ba0f03eda\", serviceId: \"d513f82f-3c3b-4ecc-b57e-237a58b38d2b\" }) { id } }"
            }')
          
          echo "Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Deployment triggered successfully!"
          else
            echo "❌ Failed to trigger deployment"
            echo "$RESPONSE"
            exit 1
          fi
