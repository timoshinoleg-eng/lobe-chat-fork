name: Railway Auto Deploy

on:
  push:
    branches: [canary]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli
          railway --version

      - name: Debug Environment
        run: |
          echo "RAILWAY_TOKEN is set: ${{ secrets.RAILWAY_TOKEN != '' }}"
          echo "Project ID: 3976f97a-f083-46f3-afdc-351ba0f03eda"
          echo "Service ID: d513f82f-3c3b-4ecc-b57e-237a58b38d2b"

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -x
          echo "Logging in to Railway..."
          railway login --token "$RAILWAY_TOKEN"
          echo "Login successful"
          
          echo "Linking to project..."
          railway link --project 3976f97a-f083-46f3-afdc-351ba0f03eda --service d513f82f-3c3b-4ecc-b57e-237a58b38d2b
          echo "Link successful"
          
          echo "Starting deployment..."
          railway up
          echo "Deployment complete"
